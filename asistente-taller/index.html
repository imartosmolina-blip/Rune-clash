<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Asistente Taller</title>
<style>
:root{--bg:#07101d;--p:#111c2d;--p2:#18263a;--line:#2d4059;--txt:#f5f7fb;--muted:#9fb0c8;--a:#4ea1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#07101d,#0b1422 45%,#08111d);color:var(--txt)}
.app{max-width:920px;margin:auto;padding:22px 18px 36px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
h1{margin:0;font-size:clamp(30px,6vw,48px)}
.sub{margin:7px 0 0;color:var(--muted)}
.badge{padding:8px 12px;border-radius:999px;background:#0e2135;border:1px solid #294660;color:#cbe7ff;font-size:12px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.card{min-height:118px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--p2),var(--p));color:white;font-weight:900;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.card span{font-size:32px}.card:active{transform:scale(.98)}
.panel{border:1px solid var(--line);border-radius:20px;background:rgba(16,27,45,.94);padding:16px;box-shadow:0 12px 28px rgba(0,0,0,.25)}
label{display:block;margin-bottom:8px;color:#c9d7e9;font-weight:800;font-size:13px}
textarea,input{width:100%;border:1px solid #344c68;border-radius:14px;background:#081321;color:white;padding:14px;font:inherit;font-size:16px;outline:none}
textarea{min-height:160px;resize:vertical}
textarea:focus,input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(78,161,255,.12)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:14px 12px;font-size:15px;font-weight:900;cursor:pointer}
.secondary{background:#1a2b43;color:#edf5ff;border:1px solid #304863}.primary{background:linear-gradient(135deg,#4ea1ff,#2079e8);color:white}.green{background:linear-gradient(135deg,#34cc8f,#188a61);color:white}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick button{background:#102034;color:#dcecff;border:1px solid #2f435c;border-radius:13px;padding:12px;font-weight:800}
.calc{display:none;margin-top:15px}.calc.show{display:block}.calcbox{display:grid;grid-template-columns:1fr auto;gap:10px}
.status{min-height:22px;margin-top:10px;color:#9dd3ff;font-size:13px;font-weight:800}
.note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.top{flex-direction:column}.card{min-height:104px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>🛠️ ASISTENTE TALLER</h1><p class="sub">Armarios, cajones, cajoneras, tarifa técnica y croquis.</p></div>
    <div class="badge">BAIX MODULS</div>
  </div>

  <div class="grid">
    <button class="card" onclick="preset('armarios')"><span>🗄️</span>ARMARIOS</button>
    <button class="card" onclick="preset('cajones')"><span>📦</span>CAJONES</button>
    <button class="card" onclick="preset('cajoneras')"><span>🗃️</span>CAJONERAS</button>
    <button class="card" onclick="preset('tarifa')"><span>📖</span>TARIFA</button>
    <button class="card" onclick="preset('croquis')"><span>📐</span>CROQUIS</button>
    <button class="card" onclick="toggleCalc()"><span>🧮</span>CALCULADORA</button>
  </div>

  <div class="panel">
    <label for="q">Dime qué necesitas</label>
    <textarea id="q" placeholder="Ejemplo: Tengo una caja de 100 cm. ¿Qué cajonera de 3 cajones puedo montar y cuánto mide el costado?"></textarea>

    <div class="quick">
      <button onclick="addTarifa()">📖 CONSULTAR TARIFA TÉCNICA</button>
      <button onclick="clearQ()">🧹 LIMPIAR</button>
    </div>

    <div class="row">
      <button class="btn secondary" onclick="dictate()">🎙️ Dictar</button>
      <button class="btn secondary" onclick="copyQ()">📋 Copiar</button>
      <button class="btn primary" onclick="openGPT()">✨ Abrir ChatGPT</button>
    </div>

    <div id="calc" class="calc">
      <label for="expr">Calculadora rápida</label>
      <div class="calcbox">
        <input id="expr" inputmode="decimal" placeholder="Ej.: 1000 - 39">
        <button class="btn green" onclick="calc()">Calcular</button>
      </div>
      <div id="calcResult" class="status"></div>
    </div>

    <div id="status" class="status"></div>
    <div class="note">En consultas de trabajo sobre armarios, usa la tarifa técnica ESENZIA 4.0 como referencia principal. No inventes medidas y comprueba los datos dos veces.</div>
  </div>
</div>
<script>
const q=document.getElementById('q'),st=document.getElementById('status');
const p={
armarios:'Consulta de trabajo sobre un armario. Usa la tarifa técnica ESENZIA 4.0 de Baixmoduls como referencia, no inventes medidas y comprueba los datos dos veces. ',
cajones:'Consulta de trabajo sobre cajones interiores de armario. Usa las medidas técnicas que te he dado y la tarifa ESENZIA 4.0 cuando corresponda. Comprueba dos veces. ',
cajoneras:'Consulta de trabajo sobre una cajonera. Necesito medidas de costados, frentes, sobre y distribución según la tarifa técnica ESENZIA 4.0. Comprueba dos veces. ',
tarifa:'Consulta la tarifa técnica ESENZIA 4.0 de Baixmoduls. Dame el dato exacto y di claramente si la tarifa no lo especifica. Comprueba dos veces. ',
croquis:'Hazme un croquis técnico claro, estilo tarifa técnica, con todas las cotas necesarias. Usa solo medidas verificadas. '
};
function status(t){st.textContent=t}
function preset(k){q.value=p[k]||'';q.focus();status('Plantilla cargada')}
function addTarifa(){q.value='Consulta la tarifa técnica ESENZIA 4.0 de Baixmoduls como fuente principal. No inventes ninguna medida. Comprueba dos veces los datos antes de responder. '+q.value.trim();status('Consulta preparada con la tarifa técnica')}
function clearQ(){q.value='';q.focus();status('')}
async function copyQ(){if(!q.value.trim()){status('Escribe una consulta primero');return}try{await navigator.clipboard.writeText(q.value.trim());status('Consulta copiada')}catch(e){q.select();document.execCommand('copy');status('Consulta copiada')}}
function openGPT(){const t=q.value.trim();if(t){navigator.clipboard?.writeText(t).catch(()=>{});status('Consulta copiada. Pégala en ChatGPT.')}window.open('https://chatgpt.com/','_blank')}
function dictate(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status('El dictado no está disponible en este navegador');return}const r=new SR();r.lang='es-ES';r.interimResults=false;r.maxAlternatives=1;status('Escuchando…');r.onresult=e=>{q.value+=(q.value.trim()?' ':'')+e.results[0][0].transcript;status('Dictado añadido')};r.onerror=()=>status('No se pudo usar el dictado');r.start()}
function toggleCalc(){document.getElementById('calc').classList.toggle('show');document.getElementById('expr').focus()}
function calc(){const x=document.getElementById('expr').value.trim().replace(/,/g,'.'),o=document.getElementById('calcResult');if(!/^[0-9+\-*/().\s]+$/.test(x)){o.textContent='Operación no válida';return}try{o.textContent='Resultado: '+Function('"use strict";return ('+x+')')()}catch(e){o.textContent='No se pudo calcular'}}
</script>
</body>
</html>
