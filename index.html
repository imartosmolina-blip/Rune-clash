<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rune Clash</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #101326;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.game {
  max-width: 430px;
  margin: auto;
  padding: 18px;
}

h1 {
  margin: 8px 0 15px;
  font-size: 30px;
}

.stats {
  display: flex;
  justify-content: space-around;
  background: #202540;
  padding: 12px;
  border-radius: 16px;
  margin-bottom: 15px;
}

.enemy {
  font-size: 68px;
  margin-top: 8px;
}

.enemy-name {
  font-size: 22px;
  font-weight: bold;
  margin: 5px;
}

.bar {
  height: 17px;
  background: #383b50;
  border-radius: 20px;
  overflow: hidden;
  margin: 10px 0 5px;
}

.enemy-hp {
  height: 100%;
  width: 100%;
  background: #ef3d3d;
  transition: width .25s;
}

.player-info {
  display: flex;
  justify-content: space-around;
  margin: 12px 0;
  font-size: 17px;
}

.message {
  min-height: 28px;
  font-weight: bold;
  margin: 10px 0;
}

.board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  background: #1c2038;
  padding: 8px;
  border-radius: 18px;
}

.tile {
  aspect-ratio: 1;
  border: none;
  border-radius: 12px;
  background: #303654;
  font-size: 29px;
  cursor: pointer;
}

.tile:active {
  transform: scale(.9);
}

.legend {
  margin-top: 15px;
  font-size: 14px;
  line-height: 1.8;
  color: #cdd1e8;
}

.next {
  display: none;
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border: none;
  border-radius: 15px;
  background: #7447ff;
  color: white;
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="game">

<h1>⚔️ RUNE CLASH</h1>

<div class="stats">
  <div>🪙 <span id="gold">0</span></div>
  <div>⭐ Nivel <span id="level">1</span></div>
  <div>🏆 <span id="wins">0</span></div>
</div>

<div class="enemy">👹</div>
<div class="enemy-name">Goblin</div>

<div class="bar">
  <div class="enemy-hp" id="enemyBar"></div>
</div>

<div>
❤️ Enemigo:
<span id="enemyHpText">180</span> / 
<span id="enemyMaxText">180</span>
</div>

<div class="player-info">
  <div>❤️ <span id="playerHp">100</span>/100</div>
  <div>🛡️ <span id="shield">0</span></div>
</div>

<div class="message" id="message">
Toca un grupo de 2 o más runas iguales
</div>

<div class="board" id="board"></div>

<button class="next" id="next" onclick="nextEnemy()">
SIGUIENTE ENEMIGO
</button>

<div class="legend">
⚔️ Ataque &nbsp; 🔥 Magia<br>
🛡️ Escudo &nbsp; ❤️ Curación
</div>

</div>

<script>

const SIZE = 6;

const runes = ["⚔️","🔥","🛡️","❤️"];

let board = [];

let enemyMax = 180;
let enemyHp = 180;

let playerHp = 100;
let shield = 0;

let gold = 0;
let level = 1;
let wins = 0;

let battleOver = false;
  const SAVE_KEY = "runeClashSave";

function saveGame() {
  const data = {
    gold: gold,
    level: level,
    wins: wins
  };

  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

function loadGame() {
  const saved = localStorage.getItem(SAVE_KEY);

  if (!saved) return;

  const data = JSON.parse(saved);

  gold = data.gold || 0;
  level = data.level || 1;
  wins = data.wins || 0;
}

function randomRune() {
  return runes[Math.floor(Math.random() * runes.length)];
}

function createBoard() {
  board = [];

  for (let r = 0; r < SIZE; r++) {
    board[r] = [];

    for (let c = 0; c < SIZE; c++) {
      board[r][c] = randomRune();
    }
  }

  renderBoard();
}

function renderBoard() {

  const container = document.getElementById("board");

  container.innerHTML = "";

  for (let r = 0; r < SIZE; r++) {

    for (let c = 0; c < SIZE; c++) {

      const button = document.createElement("button");

      button.className = "tile";

      button.textContent = board[r][c];

      button.onclick = () => selectRune(r,c);

      container.appendChild(button);
    }
  }
}

function findGroup(row,col) {

  const target = board[row][col];

  const visited = Array.from(
    {length: SIZE},
    () => Array(SIZE).fill(false)
  );

  const group = [];

  const stack = [[row,col]];

  while (stack.length) {

    const [r,c] = stack.pop();

    if (
      r < 0 ||
      r >= SIZE ||
      c < 0 ||
      c >= SIZE ||
      visited[r][c] ||
      board[r][c] !== target
    ) continue;

    visited[r][c] = true;

    group.push([r,c]);

    stack.push(
      [r+1,c],
      [r-1,c],
      [r,c+1],
      [r,c-1]
    );
  }

  return group;
}

function selectRune(row,col) {

  if (battleOver) return;

  const group = findGroup(row,col);

  if (group.length < 2) {

    document.getElementById("message").textContent =
      "Necesitas juntar al menos 2 runas iguales";

    return;
  }

  const rune = board[row][col];

  activateRune(rune,group.length);

  removeGroup(group);

  collapseBoard();

  renderBoard();

  updateUI();

  if (enemyHp <= 0) {
    winBattle();
    return;
  }

  enemyAttack();
}

function activateRune(rune,count) {

  let power = 0;

  if (rune === "⚔️") {

    power = count * 6;

    enemyHp -= power;

    message("⚔️ Ataque: -" + power + " al Goblin");

  }

  if (rune === "🔥") {

    power = count * 8;

    enemyHp -= power;

    message("🔥 Magia: -" + power + " al Goblin");

  }

  if (rune === "🛡️") {

    power = count * 5;

    shield += power;

    message("🛡️ +" + power + " de escudo");

  }

  if (rune === "❤️") {

    power = count * 5;

    playerHp = Math.min(100,playerHp + power);

    message("❤️ +" + power + " de vida");

  }

  enemyHp = Math.max(0,enemyHp);
}

function removeGroup(group) {

  for (const [r,c] of group) {
    board[r][c] = null;
  }
}

function collapseBoard() {

  for (let c = 0; c < SIZE; c++) {

    let column = [];

    for (let r = SIZE - 1; r >= 0; r--) {

      if (board[r][c] !== null) {
        column.push(board[r][c]);
      }
    }

    while (column.length < SIZE) {
      column.push(randomRune());
    }

    for (let r = SIZE - 1; r >= 0; r--) {
      board[r][c] = column[SIZE - 1 - r];
    }
  }
}

function enemyAttack() {

  const damage = 8 + Math.floor(level * 1.5);

  let remaining = damage;

  if (shield > 0) {

    const blocked = Math.min(shield,remaining);

    shield -= blocked;

    remaining -= blocked;
  }

  playerHp -= remaining;

  playerHp = Math.max(0,playerHp);

  updateUI();

  if (playerHp <= 0) {

    battleOver = true;

    document.getElementById("message").textContent =
      "💀 Has sido derrotado";

    document.getElementById("next").style.display = "block";

    document.getElementById("next").textContent =
      "REINTENTAR";
  }
}

function winBattle() {

  battleOver = true;

  gold += 100 + level * 20;

  wins++;
  saveGame();
  

  document.getElementById("message").textContent =
    "🎉 ¡Goblin derrotado! +" +
    (100 + level * 20) +
    " 🪙";

  document.getElementById("next").style.display = "block";

  document.getElementById("next").textContent =
    "SIGUIENTE ENEMIGO";

  updateUI();
}

function nextEnemy() {

  if (playerHp > 0) {
    level++;
  }
  saveGame();

  enemyMax = 180 + ((level - 1) * 35);

  enemyHp = enemyMax;

  playerHp = 100;

  shield = 0;

  battleOver = false;

  document.getElementById("next").style.display = "none";

  document.getElementById("message").textContent =
    "Toca un grupo de 2 o más runas iguales";
loadGame();

enemyMax = 180 + ((level - 1) * 35);
enemyHp = enemyMax;
  createBoard();

  updateUI();
}

function updateUI() {

  document.getElementById("enemyHpText").textContent =
    enemyHp;

  document.getElementById("enemyMaxText").textContent =
    enemyMax;

  document.getElementById("playerHp").textContent =
    playerHp;

  document.getElementById("shield").textContent =
    shield;

  document.getElementById("gold").textContent =
    gold;

  document.getElementById("level").textContent =
    level;

  document.getElementById("wins").textContent =
    wins;

  const percent =
    (enemyHp / enemyMax) * 100;

  document.getElementById("enemyBar").style.width =
    percent + "%";
}

function message(text) {
  document.getElementById("message").textContent = text;
}

createBoard();
updateUI();

</script>

</body>
</html>
