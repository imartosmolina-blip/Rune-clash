<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <title>Rune Clash</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 0%, #35245f 0%, #1a1733 38%, #0c0d18 100%);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.game {
  max-width: 430px;
  margin: auto;
  padding: 18px;
}

h1 {
  margin: 8px 0 15px;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #f3c969;
  text-shadow:
    0 2px 0 #7b4b16,
    0 0 14px rgba(243, 201, 105, 0.45);
}

.stats {
  display: flex;
  justify-content: space-around;
  background: linear-gradient(180deg, #29264a, #1b1d35);
  padding: 12px;
  border-radius: 16px;
  margin-bottom: 15px;
  border: 1px solid rgba(243, 201, 105, 0.25);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
}
.enemy {
  font-size: 82px;
  margin-top: 10px;
  margin-bottom: 4px;
  filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45));
}

.enemy-name {
  font-size: 23px;
  font-weight: 800;
  margin: 5px;
  color: #f3c969;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
}

.bar {
  height: 18px;
  background: #17192b;
  border-radius: 20px;
  overflow: hidden;
  margin: 10px 0 5px;
  border: 2px solid #4c4964;
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.45);
}

.enemy-hp {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ff6b6b, #e52f4f);
  box-shadow: 0 0 10px rgba(255, 70, 90, 0.45);
  transition: width .25s;
}

.player-info {
  display: flex;
  justify-content: space-around;
  margin: 14px 0;
  padding: 12px;
  font-size: 17px;
  font-weight: bold;
  background: linear-gradient(180deg, #29264a, #1b1d35);
  border-radius: 14px;
  border: 1px solid rgba(243, 201, 105, 0.18);
  box-shadow: 0 5px 14px rgba(0, 0, 0, 0.28);
}

.message {
  min-height: 28px;
  font-weight: bold;
  margin: 10px 0;
}

.board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 7px;
  background: linear-gradient(180deg, #23203d, #141527);
  padding: 10px;
  border-radius: 20px;
  border: 2px solid rgba(243, 201, 105, 0.25);
  box-shadow:
    inset 0 0 18px rgba(0, 0, 0, 0.45),
    0 8px 22px rgba(0, 0, 0, 0.35);
}

.tile {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  font-size: 30px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  color: #ffffff;
  text-shadow:
    0 2px 0 rgba(0, 0, 0, 0.35),
    0 0 10px rgba(255, 255, 255, 0.10);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.22),
    inset 0 -6px 10px rgba(0, 0, 0, 0.28),
    0 6px 14px rgba(0, 0, 0, 0.28);
  transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
}

.tile:active {
  transform: scale(0.96);
  filter: brightness(0.95);
}

.tile.attack {
  background: linear-gradient(180deg, #d85b5b 0%, #a12d2d 55%, #7f1f1f 100%);
  border-color: rgba(255, 210, 210, 0.30);
}

.tile.magic {
  background: linear-gradient(180deg, #ffb45c 0%, #e67e22 55%, #b85d10 100%);
  border-color: rgba(255, 229, 180, 0.30);
}

.tile.shield {
  background: linear-gradient(180deg, #68b6ff 0%, #2f7de1 55%, #1d56a8 100%);
  border-color: rgba(210, 230, 255, 0.30);
}

.tile.heal {
  background: linear-gradient(180deg, #62de8a 0%, #2fb463 55%, #1f8a49 100%);
  border-color: rgba(210, 255, 225, 0.30);
}
.legend {
  margin-top: 15px;
  font-size: 14px;
  line-height: 1.8;
  color: #cdd1e8;
}

.next {
  display: none;
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border: none;
  border-radius: 15px;
  background: #7447ff;
  color: white;
  font-size: 20px;
  font-weight: bold;
}
  /* ===== LEYENDA NUEVA DE RUNAS ===== */

.rune-legend {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 16px;
  padding: 4px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.09);

  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.08),
    rgba(255,255,255,0.025)
  );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 5px 12px rgba(0,0,0,0.20);
}

.legend-item:active {
  transform: scale(0.96);
  filter: brightness(1.12);
}

.legend-icon {
  width: 38px;
  height: 38px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 11px;
}

.legend-icon svg {
  width: 21px;
  height: 21px;
  stroke-width: 2.6;
  color: white;
}

.legend-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.legend-text span {
  font-size: 13px;
  font-weight: 800;
  color: white;
}

.legend-text small {
  margin-top: 3px;
  font-size: 10px;
  color: rgba(255,255,255,0.55);
}


/* ATAQUE */

.legend-attack .legend-icon {
  background: linear-gradient(
    145deg,
    #ff5252,
    #b71c1c
  );

  box-shadow:
    0 4px 10px rgba(220,40,40,0.30),
    inset 0 1px 2px rgba(255,255,255,0.30);
}


/* MAGIA */

.legend-magic .legend-icon {
  background: linear-gradient(
    145deg,
    #ffad42,
    #e65100
  );

  box-shadow:
    0 4px 10px rgba(255,120,20,0.30),
    inset 0 1px 2px rgba(255,255,255,0.30);
}


/* ESCUDO */

.legend-shield .legend-icon {
  background: linear-gradient(
    145deg,
    #4da3ff,
    #1565c0
  );

  box-shadow:
    0 4px 10px rgba(40,120,255,0.30),
    inset 0 1px 2px rgba(255,255,255,0.30);
}


/* CURACIÓN */

.legend-heal .legend-icon {
  background: linear-gradient(
    145deg,
    #51d88a,
    #16864d
  );

  box-shadow:
    0 4px 10px rgba(40,200,110,0.30),
    inset 0 1px 2px rgba(255,255,255,0.30);
}


/* ===== MEJORA EXTRA DE LAS FICHAS ===== */

.attack,
.magic,
.shield,
.heal {
  position: relative;
  overflow: hidden;

  transition:
    transform 0.12s ease,
    filter 0.12s ease,
    box-shadow 0.12s ease;
}

.attack:active,
.magic:active,
.shield:active,
.heal:active {
  transform: scale(0.90);
  filter: brightness(1.18);
}


/* Brillo superior */

.attack::after,
.magic::after,
.shield::after,
.heal::after {
  content: "";
  position: absolute;

  top: 4px;
  left: 7px;
  right: 7px;

  height: 22%;
  border-radius: 50%;

  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.25),
    rgba(255,255,255,0)
  );

  pointer-events: none;
}


/* Iconos del tablero */

.attack svg,
.magic svg,
.shield svg,
.heal svg {
  position: relative;
  z-index: 2;

  width: 55%;
  height: 55%;

  stroke-width: 2.6;

  filter: drop-shadow(
    0 2px 2px rgba(0,0,0,0.35)
  );
}
  /* ==================================================
   NUEVA ZONA DE COMBATE RPG
   ================================================== */

.combat-panel {
  position: relative;
  margin: 14px 0 12px;
  padding: 14px;

  border-radius: 20px;

  background:
    linear-gradient(
      145deg,
      rgba(55, 36, 95, 0.90),

/* ===== CABECERA ENEMIGO ===== */

.enemy-header {

}

.enemy {

.enemy-label {

/* ===== VIDA ENEMIGO ===== */

.health-text {

}

.health-text strong {

}


/* ===== BARRA DE VIDA ===== */

.combat-panel .bar {
  position: relative;

  width: 100%;
  height: 16px;

  overflow: hidden;

  border-radius: 999px;

  background:

.combat-panel .enemy-hp {

.combat-panel .enemy-hp::after {

/* ==================================================
   PANEL DEL HÉROE
   ================================================== */

.player-card {
  margin: 0 0 14px;
  padding: 12px 14px 14px;

  background:

    );

  border:
    1px solid rgba(100, 155, 255, 0.22);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.07),
    0 7px 16px rgba(0,0,0,0.25);
}


/* Título héroe */

.player-title {
  display: flex;
  align-items: center;
  gap: 7px;

  color: rgba(255,255,255,0.60);

/* Dos estadísticas */

.player-card .player-info {
  display: grid;

/* Cada estadística */

.player-stat {
  display: flex;

/* Iconos */

.player-stat-icon {

  display: flex;

.player-heart {

    );

    linear-gradient(

/* Texto */

.player-stat-text {

}

.player-stat-text small {

    rgba(255,255,255,0.48);

/* ==================================================

.message {

<body>

<div class="game">

<h1>⚔️ RUNE CLASH</h1>

<div class="stats">
  <div>🪙 <span id="gold">0</span></div>
  <div>⭐ Nivel <span id="level">1</span></div>
  <div>🏆 <span id="wins">0</span></div>
</div>

<!-- ===== ZONA DE COMBATE ===== -->

<div class="combat-panel">

  <div class="enemy-header">
    <div class="enemy">👹</div>

    <div class="enemy-details">
      <div class="enemy-label">ENEMIGO</div>
      <div class="enemy-name">Goblin</div>
    </div>
  </div>

  <div class="enemy-health-row">
    <span class="health-icon">❤️</span>

    <div class="enemy-health-area">

      <div class="health-text">
        <span>VIDA</span>

        <strong>
          <span id="enemyHpText">180</span>
          /
          <span id="enemyMaxText">180</span>
        </strong>
      </div>

      <div class="bar">
        <div class="enemy-hp" id="enemyBar"></div>
      </div>

    </div>

</div>


<div class="player-card">

  </div>

  <div class="player-info">

    <div class="player-stat">
  <div class="player-stat-icon player-heart">
    <i data-lucide="heart-pulse"></i>
  </div>

  <div class="player-stat-text">
    <small>VIDA</small>
    <strong>
      <span id="playerHp">100</span>/100
    </strong>
  </div>
</div>

    <div class="player-stat">
  <div class="player-stat-icon player-shield">
    <i data-lucide="shield"></i>
  </div>

  <div class="player-stat-text">
    <small>ESCUDO</small>
    <strong>
      <span id="shield">0</span>
    </strong>
  </div>
</div>

  </div>

</div>

<div class="message" id="message">
Toca un grupo de 2 o más runas iguales
</div>

<div class="board" id="board"></div>

<button class="next" id="next" onclick="nextEnemy()">
SIGUIENTE ENEMIGO
</button>

<div class="rune-legend">
  <div class="legend-item legend-attack">
    <div class="legend-icon">
      <i data-lucide="swords"></i>
    </div>
    <div class="legend-text">
      <span>Ataque</span>
      <small>Daño físico</small>
    </div>
  </div>

  <div class="legend-item legend-magic">
    <div class="legend-icon">
      <i data-lucide="flame"></i>
    </div>
    <div class="legend-text">
      <span>Magia</span>
      <small>Daño mágico</small>
    </div>
  </div>

  <div class="legend-item legend-shield">
    <div class="legend-icon">
      <i data-lucide="shield"></i>
    </div>
    <div class="legend-text">
      <span>Escudo</span>
      <small>Protección</small>
    </div>
  </div>

  <div class="legend-item legend-heal">
    <div class="legend-icon">
      <i data-lucide="heart-pulse"></i>
    </div>
    <div class="legend-text">
      <span>Curación</span>
      <small>Recupera vida</small>
    </div>
  </div>
</div>

</div>

<script>

const SIZE = 6;

const runes = ["⚔️","🔥","🛡️","❤️"];

let board = [];

let enemyMax = 180;
let enemyHp = 180;

let playerHp = 100;
let shield = 0;

let gold = 0;
let level = 1;
let wins = 0;

let battleOver = false;
 function saveGame() {
  const data = {
    gold: gold,
    level: level,
    wins: wins
  };

  Telegram.WebApp.CloudStorage.setItem(
    "runeClashSave",
    JSON.stringify(data)
  );
}

function loadGame(done) {
  Telegram.WebApp.CloudStorage.getItem(
    "runeClashSave",
    function(error, value) {

      if (!error && value) {
        const data = JSON.parse(value);

        gold = data.gold || 0;
        level = data.level || 1;
        wins = data.wins || 0;
      }

      done();
    }
  );
}

function randomRune() {
  return runes[Math.floor(Math.random() * runes.length)];
}

function createBoard() {
  board = [];

  for (let r = 0; r < SIZE; r++) {
    board[r] = [];

    for (let c = 0; c < SIZE; c++) {
      board[r][c] = randomRune();
    }
  }

  renderBoard();
}

function renderBoard() {

  const container = document.getElementById("board");

  container.innerHTML = "";

  for (let r = 0; r < SIZE; r++) {

    for (let c = 0; c < SIZE; c++) {

      const button = document.createElement("button");

      button.className = "tile";

const rune = board[r][c];

if (rune === "⚔️") button.classList.add("attack");
if (rune === "🔥") button.classList.add("magic");
if (rune === "🛡️") button.classList.add("shield");
if (rune === "❤️") button.classList.add("heal");

button.innerHTML = {
  "⚔️": '<i data-lucide="swords"></i>',
  "🔥": '<i data-lucide="flame"></i>',
  "🛡️": '<i data-lucide="shield"></i>',
  "❤️": '<i data-lucide="heart-pulse"></i>'
}[rune] || rune;

      button.onclick = () => selectRune(r,c);

      container.appendChild(button);
    }
  }
  lucide.createIcons();
}

function findGroup(row,col) {

  const target = board[row][col];

  const visited = Array.from(
    {length: SIZE},
    () => Array(SIZE).fill(false)
  );

  const group = [];

  const stack = [[row,col]];

  while (stack.length) {

    const [r,c] = stack.pop();

    if (
      r < 0 ||
      r >= SIZE ||
      c < 0 ||
      c >= SIZE ||
      visited[r][c] ||
      board[r][c] !== target
    ) continue;

    visited[r][c] = true;

    group.push([r,c]);

    stack.push(
      [r+1,c],
      [r-1,c],
      [r,c+1],
      [r,c-1]
    );
  }

  return group;
}

function selectRune(row,col) {

  if (battleOver) return;

  const group = findGroup(row,col);

  if (group.length < 2) {

    document.getElementById("message").textContent =
      "Necesitas juntar al menos 2 runas iguales";

    return;
  }

  const rune = board[row][col];

  activateRune(rune,group.length);

  removeGroup(group);

  collapseBoard();

  renderBoard();

  updateUI();

  if (enemyHp <= 0) {
    winBattle();
    return;
  }

  enemyAttack();
}

function activateRune(rune,count) {

  let power = 0;

  if (rune === "⚔️") {

    power = count * 6;

    enemyHp -= power;

    message("⚔️ Ataque: -" + power + " al Goblin");

  }

  if (rune === "🔥") {

    power = count * 8;

    enemyHp -= power;

    message("🔥 Magia: -" + power + " al Goblin");

  }

  if (rune === "🛡️") {

    power = count * 5;

    shield += power;

    message("🛡️ +" + power + " de escudo");

  }

  if (rune === "❤️") {

    power = count * 5;

    playerHp = Math.min(100,playerHp + power);

    message("❤️ +" + power + " de vida");

  }

  enemyHp = Math.max(0,enemyHp);
}

function removeGroup(group) {

  for (const [r,c] of group) {
    board[r][c] = null;
  }
}

function collapseBoard() {

  for (let c = 0; c < SIZE; c++) {

    let column = [];

    for (let r = SIZE - 1; r >= 0; r--) {

      if (board[r][c] !== null) {
        column.push(board[r][c]);
      }
    }

    while (column.length < SIZE) {
      column.push(randomRune());
    }

    for (let r = SIZE - 1; r >= 0; r--) {
      board[r][c] = column[SIZE - 1 - r];
    }
  }
}

function enemyAttack() {

  const damage = 8 + Math.floor(level * 1.5);

  let remaining = damage;

  if (shield > 0) {

    const blocked = Math.min(shield,remaining);

    shield -= blocked;

    remaining -= blocked;
  }

  playerHp -= remaining;

  playerHp = Math.max(0,playerHp);

  updateUI();

  if (playerHp <= 0) {

    battleOver = true;

    document.getElementById("message").textContent =
      "💀 Has sido derrotado";

    document.getElementById("next").style.display = "block";

    document.getElementById("next").textContent =
      "REINTENTAR";
  }
}

function winBattle() {

  battleOver = true;

  gold += 100 + level * 20;

  wins++;
  saveGame();
  

  document.getElementById("message").textContent =
    "🎉 ¡Goblin derrotado! +" +
    (100 + level * 20) +
    " 🪙";

  document.getElementById("next").style.display = "block";

  document.getElementById("next").textContent =
    "SIGUIENTE ENEMIGO";

  updateUI();
}

function nextEnemy() {

  if (playerHp > 0) {
    level++;
  }
  saveGame();

  enemyMax = 180 + ((level - 1) * 35);

  enemyHp = enemyMax;

  playerHp = 100;

  shield = 0;

  battleOver = false;

  document.getElementById("next").style.display = "none";

  document.getElementById("message").textContent =
    "Toca un grupo de 2 o más runas iguales";


enemyMax = 180 + ((level - 1) * 35);
enemyHp = enemyMax;
  createBoard();

  updateUI();
}

function updateUI() {

  document.getElementById("enemyHpText").textContent =
    enemyHp;

  document.getElementById("enemyMaxText").textContent =
    enemyMax;

  document.getElementById("playerHp").textContent =
    playerHp;

  document.getElementById("shield").textContent =
    shield;

  document.getElementById("gold").textContent =
    gold;

  document.getElementById("level").textContent =
    level;

  document.getElementById("wins").textContent =
    wins;

  const percent =
    (enemyHp / enemyMax) * 100;

  document.getElementById("enemyBar").style.width =
    percent + "%";
}

function message(text) {
  document.getElementById("message").textContent = text;
}


Telegram.WebApp.ready();

loadGame(function() {

  enemyMax = 180 + ((level - 1) * 35);
  enemyHp = enemyMax;

  createBoard();
  updateUI();

});

</script>
